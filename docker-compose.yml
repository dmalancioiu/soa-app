version: "3.9"

services:
  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - shell
    networks:
      - novamart

  gateway:
    build: ./services/gateway
    environment:
      - SERVER_PORT=8081
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - JWT_SECRET=supersecretkey123supersecretkey123
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - catalog-service
      - order-service
      - notification-service
      - rabbitmq
      - kafka
      - localstack
    networks:
      - novamart

  catalog-service:
    build: ./services/catalog-service
    environment:
      - SERVER_PORT=8082
      - SPRING_RABBITMQ_HOST=rabbitmq
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=3306
      - MYSQL_DB=novamart
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
    depends_on:
      - rabbitmq
    networks:
      - novamart

  order-service:
    build: ./services/order-service
    environment:
      - SERVER_PORT=8083
      - SPRING_RABBITMQ_HOST=rabbitmq
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=3306
      - MYSQL_DB=novamart
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
    depends_on:
      - rabbitmq
      - kafka
    networks:
      - novamart

  notification-service:
    build: ./services/notification-service
    environment:
      - SERVER_PORT=8084
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - novamart

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - novamart

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - novamart

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - novamart

  localstack:
    image: localstack/localstack:3.5
    environment:
      - SERVICES=lambda
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./faas/init:/etc/localstack/init/ready.d
      - ./faas/order-recommendation:/var/task
    networks:
      - novamart

  shell:
    build: ./mfe/shell
    environment:
      - VITE_API_BASE=/api
    networks:
      - novamart

  catalog-mfe:
    build: ./mfe/catalog
    networks:
      - novamart

  orders-mfe:
    build: ./mfe/orders
    networks:
      - novamart

networks:
  novamart:
    driver: bridge
